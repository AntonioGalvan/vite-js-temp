<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Iniciar sesión · Reporta</title>
    <link rel="stylesheet" href="/src/css/login.css" />
</head>

<body>
    <main>
        <div class="tarjeta acceso">
            <a class="marca" href="index.html">
                <img src="/src/img/logo.svg" alt="" />
                Reporta
            </a>

            <h1>Inicia sesión</h1>
            <p class="subtitulo">Entra con tu correo o nombre de usuario.</p>

            <form class="formulario" id="form-login">
                <label>
                    Correo o usuario
                    <input type="email" name="email" placeholder="juan.perez@example.com" autocomplete="username"
                        required />
                </label>

                <label>
                    Contraseña
                    <input type="password" name="password" placeholder="••••••••" autocomplete="current-password"
                        required />
                </label>

                <p class="error" id="error-login" hidden></p>

                <button class="boton" type="submit">Entrar</button>
            </form>
        </div>

        <a class="volver" href="index.html">← Volver al inicio</a>
    </main>

    <script type="module" src="/src/js/login.js"></script>
</body>

</html>
