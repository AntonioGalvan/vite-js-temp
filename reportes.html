<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Reportes · Reporta</title>
    <link rel="stylesheet" href="/src/css/reportes.css" />
</head>

<body data-seccion="reportes">
    <include src="header.html"></include>

    <main>
        <div class="titulo-pagina">
            <div>
                <h1>Reportes</h1>
                <p class="subtitulo">Problemas reportados por los vecinos.</p>
            </div>
            <a class="boton" href="reporte-form.html">Nuevo reporte</a>
        </div>

        <div class="tarjeta">
            <p class="mensaje" id="mensaje-reportes">Cargando reportes...</p>

            <table class="tabla" id="tabla-reportes" hidden>
                <thead>
                    <tr>
                        <th scope="col">Título</th>
                        <th scope="col">Colonia</th>
                        <th scope="col">Estado</th>
                        <th scope="col">Fecha</th>
                        <th scope="col"><span class="sr-only">Acciones</span></th>
                    </tr>
                </thead>
                <tbody id="body-reportes"></tbody>
            </table>
        </div>
    </main>

    <include src="footer.html"></include>

    <script type="module" src="/src/js/reportes.js"></script>
</body>

</html>
